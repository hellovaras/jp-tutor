<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Japanese AI Tutor</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --masc: #0284c7;
      --fem: #db2777;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      padding: 1.5rem 1rem;
      display: flex;
      justify-content: center;
    }
    .wrapper {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--card-border);
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .settings-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    #settingsDrawer {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 1rem;
      flex-direction: column;
      gap: 0.6rem;
    }
    .input-row { display: flex; gap: 0.5rem; }
    .input-row input {
      flex: 1;
      padding: 0.5rem 0.75rem;
      background: #0b1120;
      border: 1px solid var(--card-border);
      color: #fff;
      border-radius: 6px;
    }
    .input-row button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .register-switcher {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      background: #0b1120;
      padding: 4px;
      border-radius: 8px;
    }
    .reg-btn {
      padding: 0.6rem;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .reg-btn.active.masc {
      background: var(--masc);
      color: #fff;
    }
    .reg-btn.active.fem {
      background: var(--fem);
      color: #fff;
    }
    textarea {
      width: 100%;
      height: 90px;
      background: #0b1120;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      border-radius: 8px;
      padding: 0.75rem;
      font-size: 1rem;
      outline: none;
      resize: vertical;
    }
    textarea:focus { border-color: var(--accent); }
    .ask-btn {
      align-self: flex-end;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.65rem 1.4rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .ask-btn:hover { background: var(--accent-hover); }
    .ask-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    #outputContainer {
      display: none;
      flex-direction: column;
      gap: 1.25rem;
    }
    .japanese-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 1rem;
    }
    .japanese-display {
      font-size: 1.8rem;
      font-weight: 600;
      color: #fff;
      line-height: 1.6;
    }
    ruby rt {
      font-size: 0.55em;
      color: var(--text-muted);
      user-select: none;
    }
    .voice-btn {
      background: #334155;
      border: 1px solid #475569;
      color: #fff;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.3rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.1s ease, background 0.2s;
    }
    .voice-btn:hover {
      background: #475569;
      transform: scale(1.05);
    }
    .voice-btn:active {
      transform: scale(0.95);
    }
    .phonetic-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      background: #0b1120;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
    }
    .phonetic-grid span {
      display: block;
      color: var(--text-muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 2px;
    }
    .explanation-box {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #cbd5e1;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header>
      <h1>日本語 AI Tutor</h1>
      <button class="settings-btn" onclick="toggleSettings()">🔑 Settings</button>
    </header>

    <div id="settingsDrawer">
      <p style="font-size: 0.85rem; color: var(--text-muted);">Enter Gemini API Key (stored locally in browser only):</p>
      <div class="input-row">
        <input type="password" id="apiKeyInput" placeholder="AIzaSy..." />
        <button onclick="saveApiKey()">Save</button>
      </div>
    </div>

    <div class="card">
      <div class="register-switcher">
        <button class="reg-btn active masc" id="btnMasc" onclick="selectRegister('masculine')">Masculine Register (僕 / だ / ぞ)</button>
        <button class="reg-btn fem" id="btnFem" onclick="selectRegister('feminine')">Feminine Register (私 / ね / わ)</button>
      </div>

      <textarea id="promptText" placeholder="Enter an English phrase or Japanese grammar question..."></textarea>
      <button class="ask-btn" id="submitBtn" onclick="requestExplanation()">Ask Tutor</button>
    </div>

    <div id="outputContainer" class="card">
      <div class="japanese-header">
        <div class="japanese-display" id="outJapanese"></div>
        <button class="voice-btn" id="speakButton" onclick="speakJapanese()" title="Listen to pronunciation">🔊</button>
      </div>

      <div class="phonetic-grid">
        <div>
          <span>Hepburn Romaji</span>
          <div id="outRomaji" style="color: #fff; font-weight: 500;"></div>
        </div>
        <div>
          <span>English Phonetics</span>
          <div id="outPhonetic" style="color: #fff; font-weight: 500;"></div>
        </div>
      </div>

      <div class="explanation-box" id="outExplanation"></div>
    </div>
  </div>

  <script>
    let activeRegister = "masculine";
    let textToSpeak = "";

    window.onload = () => {
      const params = new URLSearchParams(window.location.search);
      const urlKey = params.get('key');
      if (urlKey) {
        localStorage.setItem("jp_gemini_api_key", urlKey);
      }

      const savedKey = localStorage.getItem("jp_gemini_api_key");
      if (savedKey) {
        document.getElementById("apiKeyInput").value = savedKey;
      } else {
        document.getElementById("settingsDrawer").style.display = "flex";
      }
    };

    function toggleSettings() {
      const drawer = document.getElementById("settingsDrawer");
      drawer.style.display = drawer.style.display === "flex" ? "none" : "flex";
    }

    function saveApiKey() {
      const key = document.getElementById("apiKeyInput").value.trim();
      if (!key) return;
      localStorage.setItem("jp_gemini_api_key", key);
      alert("API Key saved.");
      document.getElementById("settingsDrawer").style.display = "none";
    }

    function selectRegister(reg) {
      activeRegister = reg;
      const bM = document.getElementById("btnMasc");
      const bF = document.getElementById("btnFem");
      if (reg === 'masculine') {
        bM.className = 'reg-btn active masc';
        bF.className = 'reg-btn fem';
      } else {
        bM.className = 'reg-btn masc';
        bF.className = 'reg-btn active fem';
      }
    }

    function speakJapanese() {
      if (!textToSpeak) return;
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.lang = "ja-JP";
      utterance.rate = 0.85;

      const voices = window.speechSynthesis.getVoices();
      const jaVoice = voices.find(v => v.lang.startsWith("ja"));
      if (jaVoice) utterance.voice = jaVoice;

      window.speechSynthesis.speak(utterance);
    }

    if (typeof speechSynthesis !== "undefined" && speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
    }

    async function requestExplanation() {
      const key = localStorage.getItem("jp_gemini_api_key") || document.getElementById("apiKeyInput").value.trim();
      if (!key) {
        alert("Please configure your Gemini API key in Settings first.");
        document.getElementById("settingsDrawer").style.display = "flex";
        return;
      }

      const input = document.getElementById("promptText").value.trim();
      if (!input) return;

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.innerText = "Generating...";

      const systemPrompt = `You are a native Japanese language tutor.
Provide a Japanese translation and educational response tailored to the requested speech register: ${activeRegister.toUpperCase()}.
- For Masculine register: Use natural masculine pronouns (僕/俺), standard plain forms (だ), and masculine ending particles (ぞ/ぜ/さ/かい) where appropriate.
- For Feminine register: Use natural feminine pronouns (私), polite or softer sentence endings (わ/の/ね/かしら), and gentle sentence nuance.
- Strictly observe authentic Japanese punctuation (。、 「」).

Return ONLY valid JSON with this exact schema:
{
  "japanese_html": "Japanese sentence with <ruby>Kanji<rt>furigana</rt></ruby> tags for reading assistance and full Japanese punctuation",
  "plain_japanese": "Clean Japanese text without HTML tags for text-to-speech audio",
  "romaji": "Standard Hepburn Romaji",
  "phonetic": "English-intuitive syllable pronunciation guide (e.g. Koh-nee-chee-wah)",
  "explanation": "Register nuance analysis, vocabulary breakdown, and grammatical points"
}`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${key}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: input }] }],
            system_instruction: { parts: [{ text: systemPrompt }] },
            generationConfig: { response_mime_type: "application/json" }
          })
        });

        const resData = await response.json();

        if (resData.error) {
          alert(`Gemini API Error (${resData.error.status || 'Code ' + resData.error.code}): ${resData.error.message}`);
          return;
        }

        if (!resData.candidates || resData.candidates.length === 0) {
          alert("No response generated. Please check your prompt or safety settings.");
          return;
        }

        const parsed = JSON.parse(resData.candidates[0].content.parts[0].text);

        textToSpeak = parsed.plain_japanese || parsed.japanese_html.replace(/<[^>]*>?/gm, '');

        document.getElementById("outJapanese").innerHTML = parsed.japanese_html;
        document.getElementById("outRomaji").innerText = parsed.romaji;
        document.getElementById("outPhonetic").innerText = parsed.phonetic;
        document.getElementById("outExplanation").innerText = parsed.explanation;

        document.getElementById("outputContainer").style.display = "flex";
      } catch (err) {
        alert("Client error: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "Ask Tutor";
      }
    }
  </script>
</body>
</html>
